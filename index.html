<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pengumuman Kelulusan SMPN 1 Cigandamekar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="container">
        <img src="Logo SMPN 1 CGM (1).png" class="logo">
        <h1>Pengumuman Kelulusan</h1>
        <h2>SMPN 1 Cigandamekar</h2>
        <p>Tahun Pelajaran 2025/2026</p>

        <input type="text" id="nisn" placeholder="Masukkan NISN">

        <div class="captcha-box">
            <span id="captcha"></span>
            <button onclick="generateCaptcha()">↻</button>
        </div>

        <input type="text" id="captchaInput" placeholder="Masukkan Captcha">

        <button onclick="login()">Lihat Pengumuman</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
